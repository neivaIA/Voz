name: sonda
on: { push: { branches: [sonda] , paths: [sonda/s.sh, .github/workflows/sonda.yml]} }
permissions: { contents: write }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash sonda/s.sh > sonda/res.txt 2>&1 || true
      - run: git add -A sonda && git -c user.name=bot -c user.email=bot@x commit -qm res && git push
