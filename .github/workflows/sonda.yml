name: sonda
on: { push: { branches: [sonda] , paths: [sonda/s.py, .github/workflows/sonda.yml]} }
permissions: { contents: write }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 sonda/s.py
      - run: git add sonda/res.json && git -c user.name=bot -c user.email=bot@x commit -qm res && git push
