name: coleta4
on: { push: { branches: [sonda], paths: [sonda/coleta4.py] } }
permissions: { contents: write }
concurrency: { group: sonda-push-coleta4 }
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p sonda/out && cd sonda && python3 coleta4.py || true
